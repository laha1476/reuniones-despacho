<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Despacho Municipal v21 — Totonicapán</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #14232B;
    --surface: #1D343E;
    --surface-2: #26414C;
    --thread: #3A5560;
    --marigold: #E3A72F;
    --berry: #C1555A;
    --text: #F2EFE6;
    --muted: #9FB0AF;
    --ok: #7FAE8E;
    --whatsapp: #25D366;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Public Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--surface-2);
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--marigold);
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    max-width: 50ch;
  }

  main { padding: 22px 16px 0; }

  .day-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .day-nav button {
    background: var(--surface);
    border: 1px solid var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    cursor: pointer;
  }
  .day-nav input[type="date"] {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--surface-2);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color-scheme: dark;
  }
  .day-nav .today-btn {
    width: auto;
    padding: 0 12px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Formulario de Nueva Reunión */
  .add-card {
    background: var(--surface);
    border: 1px solid var(--marigold);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 22px;
  }
  .add-card-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--marigold);
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  @media(max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group label {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
  }
  .form-group input, .form-group select {
    background: var(--surface-2);
    border: 1px solid var(--thread);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'Public Sans', sans-serif;
    font-size: 13px;
  }
  .add-card-btn {
    width: 100%;
    background: var(--marigold);
    color: #1B140A;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Tarjeta de Reunión */
  .thread-wrap {
    position: relative;
    padding-left: 26px;
  }
  .thread-line {
    position: absolute;
    left: 9px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: linear-gradient(var(--thread), var(--thread) 70%, transparent);
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--surface-2);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card::before {
    content: '';
    position: absolute;
    left: -22px;
    top: 22px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--marigold);
    border: 2px solid var(--bg);
  }
  .card.status-Completado::before { background: var(--ok); }
  .card.status-En-Proceso::before { background: var(--marigold); }
  .card.status-Pendiente::before { background: var(--berry); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .time-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--marigold);
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
    flex: 1;
  }

  .badges-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin: 10px 0;
  }
  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    font-weight: 500;
  }
  .badge-community { background: #2D4A58; color: #BDE0FE; }
  .badge-unit { background: #4A3E2D; color: #FFE5D9; }
  .badge-status-Pendiente { background: rgba(193, 85, 90, 0.2); color: var(--berry); border: 1px solid var(--berry); }
  .badge-status-En-Proceso { background: rgba(227, 167, 47, 0.2); color: var(--marigold); border: 1px solid var(--marigold); }
  .badge-status-Completado { background: rgba(127, 174, 142, 0.2); color: var(--ok); border: 1px solid var(--ok); }

  .details-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: var(--surface-2);
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
  }
  @media(max-width: 500px) {
    .details-grid { grid-template-columns: 1fr; }
  }

  .whatsapp-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #128C7E;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    margin-top: 10px;
  }
  .whatsapp-btn:hover { background: var(--whatsapp); }

  textarea {
    width: 100%;
    min-height: 60px;
    background: var(--surface-2);
    border: 1px solid var(--thread);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: 'Public Sans', sans-serif;
    font-size: 14px;
    margin-top: 8px;
    resize: vertical;
  }

  .card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 30px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Alcaldía Municipal de Totonicapán</div>
  <h1>Agenda Despacho v21</h1>
  <div class="subtitle" id="subtitle-text">Control integral de audiencias, comunidades y seguimiento a direcciones.</div>
</header>

<main>
  <div class="day-nav">
    <button id="prev-day">‹</button>
    <input type="date" id="date-picker" />
    <button id="next-day">›</button>
    <button class="today-btn" id="today-btn">Hoy</button>
  </div>

  <!-- Formulario de Registro Rápido -->
  <div class="add-card">
    <div class="add-card-title">➕ Registrar Nueva Audiencia / Compromiso</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Hora</label>
        <input type="text" id="new-time" placeholder="09:00" />
      </div>
      <div class="form-group">
        <label>Tema / Asunto Principal</label>
        <input type="text" id="new-title" placeholder="Ej. Solicitud de balasto..." />
      </div>
      <div class="form-group">
        <label>Cantón / Aldea / Barrio</label>
        <select id="new-community">
          <option value="General / Despacho">General / Despacho</option>
          <option value="Aldea Maczul">Aldea Maczul</option>
          <option value="Cantón Chotacaj">Cantón Chotacaj</option>
          <option value="Cantón Paquí">Cantón Paquí</option>
          <option value="Cantón Chuchecaj">Cantón Chuchecaj</option>
          <option value="Aldea Pachoc">Aldea Pachoc</option>
          <option value="Tierra Blanca">Tierra Blanca</option>
          <option value="NIMAPÁ">NIMAPÁ</option>
          <option value="Otro">Otro lugar...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Unidad / Responsable Directo</label>
        <select id="new-unit">
          <optgroup label="Direcciones Municipales">
            <option value="DMP (Planificación)">DMP (Planificación)</option>
            <option value="DAFIM (Finanzas)">DAFIM (Finanzas)</option>
            <option value="Servicios Públicos">Servicios Públicos</option>
            <option value="Dirección de Obras">Dirección de Obras</option>
            <option value="Compras">Compras</option>
          </optgroup>
          <optgroup label="Autoridades y Gerencia">
            <option value="Gerencia Municipal">Gerencia Municipal</option>
            <option value="Despacho / Alcalde">Despacho / Alcalde</option>
          </optgroup>
          <optgroup label="Comunitario">
            <option value="Alcalde Comunal">Alcalde Comunal</option>
            <option value="Comité / COCODE">Comité / COCODE</option>
          </optgroup>
          <optgroup label="Personal / Enlaces">
            <option value="Amarilis Ajpop">Amarilis Ajpop</option>
            <option value="Aracely García">Aracely García</option>
            <option value="Paty Álvarez">Paty Álvarez</option>
          </optgroup>
        </select>
      </div>
    </div>
    <button class="add-card-btn" id="add-btn">Añadir a la Agenda</button>
  </div>

  <div class="thread-wrap">
    <div class="thread-line"></div>
    <div id="list"></div>
  </div>
</main>

<footer>agenda despacho municipal — v21 · Totonicapán</footer>

<script>
let meetings = [
  {
    id: "1",
    time: "09:00",
    title: "Seguimiento Techo Curvo Salón Comunal",
    community: "Aldea Maczul",
    unit: "DMP (Planificación)",
    status: "En Proceso",
    presidentName: "Juan Pérez (COCODE)",
    presidentPhone: "55551234",
    assignee: "Ing. DMP",
    note: "Se solicita dictamen técnico y revisión de presupuesto para el proyecto."
  },
  {
    id: "2",
    time: "10:30",
    title: "Mejoramiento Camino Brecha 59m",
    community: "Cantón Chotacaj",
    unit: "Dirección de Obras",
    status: "Pendiente",
    presidentName: "Mateo Vásquez",
    presidentPhone: "55555678",
    assignee: "Aracely García",
    note: "Pendiente realizar inspección de campo y topografía."
  }
];

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';

  meetings.forEach(m => {
    const card = document.createElement('div');
    card.className = `card status-${m.status.replace(' ', '-')}`;

    const waText = encodeURIComponent(
      `*INSTRUCCIÓN DE DESPACHO MUNICIPAL*\n` +
      `*Para:* ${m.unit}\n` +
      `*Comunidad:* ${m.community}\n` +
      `*Asunto:* ${m.title}\n` +
      `*Estatus:* ${m.status}\n` +
      `*Detalles / Acuerdos:* ${m.note || 'Sin detalles adicionales'}\n\n` +
      `_Por favor dar seguimiento e informar al Despacho._`
    );

    card.innerHTML = `
      <div class="card-header">
        <span class="time-badge">${m.time}</span>
        <div class="card-title">${m.title}</div>
      </div>

      <div class="badges-row">
        <span class="badge badge-community">📍 ${m.community}</span>
        <span class="badge badge-unit">👤 ${m.unit}</span>
        <span class="badge badge-status-${m.status.replace(' ', '-')}">📌 ${m.status}</span>
      </div>

      <div class="details-grid">
        <div class="form-group">
          <label>Líder / Presidente COCODE</label>
          <input type="text" value="${m.presidentName || ''}" placeholder="Nombre..." onchange="updateMeeting('${m.id}', 'presidentName', this.value)" />
        </div>
        <div class="form-group">
          <label>Teléfono Contacto</label>
          <input type="text" value="${m.presidentPhone || ''}" placeholder="Teléfono..." onchange="updateMeeting('${m.id}', 'presidentPhone', this.value)" />
        </div>
        <div class="form-group">
          <label>Estado del Compromiso</label>
          <select onchange="updateMeeting('${m.id}', 'status', this.value)">
            <option value="Pendiente" ${m.status === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
            <option value="En Proceso" ${m.status === 'En Proceso' ? 'selected' : ''}>En Proceso</option>
            <option value="Completado" ${m.status === 'Completado' ? 'selected' : ''}>Completado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Encargad(@) de Seguimiento</label>
          <input type="text" value="${m.assignee || ''}" placeholder="Persona asignada..." onchange="updateMeeting('${m.id}', 'assignee', this.value)" />
        </div>
      </div>

      <textarea placeholder="Notas, acuerdos o antecedentes..." onchange="updateMeeting('${m.id}', 'note', this.value)">${m.note || ''}</textarea>

      <div class="card-actions">
        <a href="https://api.whatsapp.com/send?text=${waText}" target="_blank" class="whatsapp-btn">
          💬 Enviar Instrucción por WhatsApp
        </a>
      </div>
    `;

    list.appendChild(card);
  });
}

function updateMeeting(id, key, value) {
  const item = meetings.find(m => m.id === id);
  if(item) {
    item[key] = value;
    render();
  }
}

document.getElementById('add-btn').addEventListener('click', () => {
  const time = document.getElementById('new-time').value || '00:00';
  const title = document.getElementById('new-title').value;
  const community = document.getElementById('new-community').value;
  const unit = document.getElementById('new-unit').value;

  if(!title) return alert('Por favor ingrese el tema de la reunión');

  meetings.push({
    id: Date.now().toString(),
    time,
    title,
    community,
    unit,
    status: 'Pendiente',
    presidentName: '',
    presidentPhone: '',
    assignee: '',
    note: ''
  });

  document.getElementById('new-title').value = '';
  render();
});

render();
</script>
</body>
</html>
